<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>공유 테스트</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
    text-align: center;
    background: #f5f5f7;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: #555; font-size: 14px; word-break: break-all; }
  button {
    margin-top: 24px;
    padding: 16px 32px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    background: #ffe812;
    color: #191919;
    font-weight: 600;
  }
  #status {
    margin-top: 20px;
    font-size: 13px;
    color: #333;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
  <h1 id="title">공유 테스트 페이지</h1>
  <p id="url"></p>
  <button id="shareBtn">카카오톡으로 공유</button>
  <div id="status"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const shareTitle = params.get("title") || "아스날 소식 공유 테스트";
    const shareUrl = params.get("url") || location.href;

    document.getElementById("title").textContent = shareTitle;
    document.getElementById("url").textContent = shareUrl;

    const statusEl = document.getElementById("status");
    const log = (msg) => { statusEl.textContent += msg + "\n"; };

    log("navigator.share 지원 여부: " + (typeof navigator.share === "function"));

    document.getElementById("shareBtn").addEventListener("click", async () => {
      statusEl.textContent = "";
      if (typeof navigator.share !== "function") {
        log("이 브라우저는 Web Share API를 지원하지 않습니다.");
        return;
      }
      try {
        await navigator.share({ title: shareTitle, url: shareUrl });
        log("공유 시트 호출 성공 (사용자가 실제로 보냈는지는 별도 확인 필요)");
      } catch (err) {
        log("공유 실패 또는 취소: " + err.name + " - " + err.message);
      }
    });
  </script>
</body>
</html>
